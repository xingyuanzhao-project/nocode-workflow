# Render Blueprint for the academic_pipeline backend + GUI.
#
# Three services:
#
# - academic-pipeline-api            (web, Docker)     — FastAPI app + Celery
#                                                        worker via supervisord.
# - academic-pipeline-redis          (redis)            — broker, result backend,
#                                                        app-state DBs (logical
#                                                        DBs 0/1/2 on one
#                                                        instance).
# - academic-pipeline-gui            (static site)      — the Vite/React SPA
#                                                        built from gui/.
#
# Free-tier deployment. The web service uses an ephemeral filesystem
# (no persistent disk). Files are lost on spin-down or redeploy.

services:
  - type: web
    name: academic-pipeline-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: server/Dockerfile
    dockerCommand: supervisord -c /app/server/supervisord.conf
    healthCheckPath: /api/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ACADEMIC_PIPELINE_REDIS_URL
        fromService:
          name: academic-pipeline-redis
          type: redis
          property: connectionString
      - key: ACADEMIC_PIPELINE_CORS_ORIGINS
        value: '["https://academic-pipeline-gui.onrender.com"]'

  - type: redis
    name: academic-pipeline-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: academic-pipeline-gui
    runtime: static
    buildCommand: cd gui && npm ci && npm run build
    staticPublishPath: gui/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://academic-pipeline-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
