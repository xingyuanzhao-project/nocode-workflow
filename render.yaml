# Render Blueprint for the nocode_workflow backend + GUI.
#
# Three services:
#
# - nocode-workflow-api            (web, Docker)     — FastAPI app + Celery
#                                                        worker via supervisord.
# - nocode-workflow-redis          (redis)            — broker, result backend,
#                                                        app-state DBs (logical
#                                                        DBs 0/1/2 on one
#                                                        instance).
# - nocode-workflow-gui            (static site)      — the Vite/React SPA
#                                                        built from gui/.
#
# Starter-plan deployment. Services stay always-on (no spin-down).
# The web service uses an ephemeral filesystem (no persistent disk).
# Files are lost on redeploy.

services:
  - type: web
    name: nocode-workflow-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: server/Dockerfile
    dockerCommand: supervisord -c /app/server/supervisord.conf
    healthCheckPath: /api/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ACADEMIC_PIPELINE_REDIS_URL
        fromService:
          name: nocode-workflow-redis
          type: redis
          property: connectionString
      - key: ACADEMIC_PIPELINE_CORS_ORIGINS
        value: '["https://nocode-workflow-gui.onrender.com"]'

  - type: redis
    name: nocode-workflow-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: nocode-workflow-gui
    runtime: static
    buildCommand: cd gui && npm ci && npm run build
    staticPublishPath: gui/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nocode-workflow-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
