# Render Blueprint for the academic_pipeline backend + GUI.
#
# Three services:
#
# - academic-pipeline-api            (web, Docker)     — FastAPI app + Celery
#                                                        worker via supervisord.
# - academic-pipeline-redis          (redis)            — broker, result backend,
#                                                        app-state DBs (logical
#                                                        DBs 0/1/2 on one
#                                                        instance).
# - academic-pipeline-gui            (static site)      — the Vite/React SPA
#                                                        built from gui/.
#
# Free-tier deployment. The web service uses an ephemeral filesystem
# (no persistent disk). Files are lost on spin-down or redeploy.
# NOT YET DEPLOYED. This file is committed so the deploy step is a
# single `render deploy` away; do not run deploy without first
# re-verifying the values of `sync: false` env vars in Render's UI.

services:
  - type: web
    name: academic-pipeline-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: server/Dockerfile
    dockerCommand: supervisord -c /app/server/supervisord.conf
    healthCheckPath: /api/health
    envVars:
      # OpenRouter credentials used by the flow_builder's .env loader.
      # Marked `sync: false` so the key is set once in Render's dashboard
      # and never checked in.
      - key: OPENROUTER_API_KEY
        sync: false
      # Shared Redis URL. Render injects the managed instance's
      # connection string automatically.
      - key: ACADEMIC_PIPELINE_REDIS_URL
        fromService:
          name: academic-pipeline-redis
          type: redis
          property: connectionString
      # CORS allowlist: the GUI origin. Set in the Render UI so the
      # deploy script never overrides it.
      - key: ACADEMIC_PIPELINE_CORS_ORIGINS
        sync: false

  - type: redis
    name: academic-pipeline-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: academic-pipeline-gui
    runtime: static
    buildCommand: cd gui && npm ci && npm run build
    staticPublishPath: gui/dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Base URL of the backend. Set to the academic-pipeline-api
      # Render URL in the dashboard (for example
      # https://academic-pipeline-api.onrender.com). Empty in local
      # previews so the built GUI uses path-relative /api URLs.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
