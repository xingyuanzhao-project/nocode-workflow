flow:
  name: demo_codebook_guided_classification
  description: "Classify articles using codebook-defined categories and scope labels"

  nodes:
    - id: input_1
      type: csv_input
      config:
        selected_file: data/demo_articles.csv
        input_columns:
          - text

    - id: proc_classify
      type: processor
      config:
        unit: row
        keys: all
        prompt:
          instructions:
            - "Classify this article according to the codebook categories provided."
            - "For each codebook dimension, pick exactly one label from the allowed options."
        io_schema:
          output:
            topic:
              type: string
            impact_scope:
              type: string

    - id: llm_1
      type: llm_call
      config:
        resource_id: default
        provider: openrouter
        model: openrouter/free
        api_base: https://openrouter.ai/api/v1
        api_key_env: OPENROUTER_API_KEY
        temperature: 0.0
        max_tokens: 512

    - id: codebook_1
      type: codebook
      config:
        codebook_id: news-topics

    - id: output_1
      type: csv_output
      config:
        output_path: results_custom/demo_codebook_classification/output.csv
        output_fields:
          - topic
          - impact_scope
        extend: false

  edges:
    - type: feedforward
      source: input_1
      target: proc_classify
    - type: feedforward
      source: proc_classify
      target: output_1
    - type: llm_call
      source: proc_classify
      target: llm_1
    - type: codebook_inquiry
      source: proc_classify
      target: codebook_1

  settings:
    processing_limit: 3
    async:
      enabled: true
      max_concurrent_rows: 5
      max_concurrent_llm_calls: 5
      max_retries: 3
    logging:
      file: results_custom/demo_codebook_classification/processing.log
      log_progress: true
    display:
      use_progress_bar: true
