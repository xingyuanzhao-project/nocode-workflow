# Node type registry for the config-driven flow runner.
#
# This file is the single source of truth for which step types the YAML
# flow loader accepts, and what default I/O schema and prompt reference
# each processor step uses when the flow YAML does not supply an
# override. src/node_registry.py parses this file into a validated
# NodeTypeRegistry object; src/flow_loader.py queries that registry to
# replace the previously hardcoded STEP_TYPES frozenset; src/flow_builder.py
# consumes each entry's default_io_schema and default_prompt_ref when
# building the per-step runtime config.
#
# Entry schema (see src/node_registry.py::NodeTypeEntry for the full
# Pydantic model):
#
#   id:                     stable identifier referenced from flow YAML.
#   category:               one of "data", "processor", "resource".
#   label:                  short human-readable name.
#   description:            longer explanation.
#   default_unit:           one of "row", "document", "entity", or null.
#   consumes:               named context fields this node reads.
#   produces:               named context fields this node writes.
#   llm_backed:             true when the node issues LLM calls.
#   requires_resources:     resource kinds needed at runtime.
#   default_io_schema:      {input: {...}, output: {...}} dict.
#                           Populated here verbatim from the hardcoded
#                           response_format dicts in src/processors.py so
#                           the no-override runtime path is byte-for-byte
#                           equivalent to the old behavior.
#   default_prompt_ref:     prompt key in config/prompts.json used when
#                           the step does not supply an override.
#   default_group_by:       default FlowConfig.steps[*].group_by.

version: 1
entries:
  # ------------------------------------------------------------------
  # processor step types
  # ------------------------------------------------------------------
  - id: processor
    category: processor
    label: Default Processor
    description: >-
      Generic processing step. Configure output schema and prompt
      instructions in the right-hand panel.
    default_unit: row
    consumes: []
    produces: []
    llm_backed: true
    requires_resources: [llm_provider]
    default_prompt_ref: null
    default_group_by: null
    default_io_schema:
      output: {}

  - id: single_summary
    category: processor
    label: Single-document summary
    description: >-
      Summarise each row or document independently using one LLM call.
    default_unit: row
    consumes: [text]
    produces: [summary]
    llm_backed: true
    requires_resources: [llm_provider]
    default_prompt_ref: summary
    default_group_by: null
    default_io_schema: null

  - id: conversation_summary_first
    category: processor
    label: Conversation summary (first)
    description: >-
      First document of a grouped entity conversation. No previous
      summary is provided.
    default_unit: document
    consumes: [text]
    produces: [summary]
    llm_backed: true
    requires_resources: [llm_provider]
    default_prompt_ref: summary_first
    default_group_by: entity
    default_io_schema: null

  - id: conversation_summary_update
    category: processor
    label: Conversation summary (update)
    description: >-
      Subsequent documents of a grouped entity conversation. Carries
      the running summary from the prior turn.
    default_unit: document
    consumes: [text]
    produces: [summary]
    llm_backed: true
    requires_resources: [llm_provider]
    default_prompt_ref: summary_update
    default_group_by: entity
    default_io_schema: null

  - id: classification
    category: processor
    label: Row-level taxonomy classification
    description: >-
      Classify each row's summary against every codebook key.
    default_unit: row
    consumes: [summary]
    produces: [classification]
    llm_backed: true
    requires_resources: [llm_provider]
    default_prompt_ref: classification
    default_group_by: null
    default_io_schema: null

  - id: label_extraction
    category: processor
    label: Per-label span extraction
    description: >-
      Extract spans matching each codebook label from every document.
    default_unit: document
    consumes: [text]
    produces: [spans]
    llm_backed: true
    requires_resources: [llm_provider]
    default_prompt_ref: label_extraction
    default_group_by: entity
    default_io_schema: null

  - id: label_summary
    category: processor
    label: Label-based summary
    description: >-
      Synthesise per-document extraction spans into an entity-level
      summary. Supports hybrid and full_async modes.
    default_unit: entity
    consumes: [spans]
    produces: [summary]
    llm_backed: true
    requires_resources: [llm_provider]
    default_prompt_ref: label_summary
    default_group_by: entity
    default_io_schema: null

  # ------------------------------------------------------------------
  # data node types
  # ------------------------------------------------------------------
  - id: csv_input
    category: data
    label: CSV input
    description: Select a CSV file from your uploaded data.
    default_unit: row
    consumes: []
    produces: [text, entity_id, doc_id, sort_by]

  - id: json_input
    category: data
    label: JSON input
    description: Select a JSON/JSONL file from your uploaded data.
    default_unit: row
    consumes: []
    produces: [text, entity_id, doc_id, sort_by]

  - id: csv_output
    category: data
    label: CSV output
    description: Write processing results to a CSV file.
    default_unit: null
    consumes: []
    produces: []

  - id: json_output
    category: data
    label: JSON output
    description: Write processing results to a JSON file.
    default_unit: null
    consumes: []
    produces: []

  # ------------------------------------------------------------------
  # resource node types
  # ------------------------------------------------------------------
  - id: llm_call
    category: resource
    label: LLM Call
    description: >-
      OpenAI-compatible chat completions endpoint. Configure the
      provider, model, and generation parameters.
    default_unit: null
    consumes: []
    produces: []

  - id: codebook
    category: resource
    label: Codebook
    description: >-
      Select a codebook from your saved codebooks to use for
      classification or label extraction.
    default_unit: null
    consumes: []
    produces: []
