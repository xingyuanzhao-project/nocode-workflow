# Node type registry for the config-driven flow runner.
#
# This file is the single source of truth for which step types the YAML
# flow loader accepts, and what default I/O schema and prompt reference
# each processor step uses when the flow YAML does not supply an
# override. src/node_registry.py parses this file into a validated
# NodeTypeRegistry object; src/flow_loader.py queries that registry to
# replace the previously hardcoded STEP_TYPES frozenset; src/flow_builder.py
# consumes each entry's default_io_schema and default_prompt_ref when
# building the per-step runtime config.
#
# Entry schema (see src/node_registry.py::NodeTypeEntry for the full
# Pydantic model):
#
#   id:                     stable identifier referenced from flow YAML.
#   category:               one of "data", "processor", "resource".
#   label:                  short human-readable name.
#   description:            longer explanation.
#   default_unit:           "row" for processors, null for others.
#   consumes:               named context fields this node reads.
#   produces:               named context fields this node writes.
#   llm_backed:             true when the node issues LLM calls.
#   requires_resources:     resource kinds needed at runtime.
#   default_io_schema:      {input: {...}, output: {...}} dict.
#                           Populated here verbatim from the hardcoded
#                           response_format dicts in src/processors.py so
#                           the no-override runtime path is byte-for-byte
#                           equivalent to the old behavior.
#   default_prompt_ref:     prompt key in config/prompts.json used when
#                           the step does not supply an override.
#   default_group_by:       deprecated, ignored.

version: 1
entries:
  # ------------------------------------------------------------------
  # processor step types
  # ------------------------------------------------------------------
  - id: processor
    category: processor
    label: Processor
    description: >-
      Generic processing step. Configure output schema and prompt
      instructions in the right-hand panel.
    default_unit: row
    consumes: []
    produces: []
    llm_backed: true
    requires_resources: [llm_provider]
    default_prompt_ref: null
    default_io_schema:
      output: {}

  # ------------------------------------------------------------------
  # data node types
  # ------------------------------------------------------------------
  - id: csv_input
    category: data
    label: CSV input
    description: Select a CSV file from your uploaded data.
    default_unit: row
    consumes: []
    produces: []

  - id: json_input
    category: data
    label: JSON input
    description: Select a JSON/JSONL file from your uploaded data.
    default_unit: row
    consumes: []
    produces: []

  - id: csv_output
    category: data
    label: CSV output
    description: Write processing results to a CSV file.
    default_unit: null
    consumes: []
    produces: []

  - id: json_output
    category: data
    label: JSON output
    description: Write processing results to a JSON file.
    default_unit: null
    consumes: []
    produces: []

  # ------------------------------------------------------------------
  # resource node types
  # ------------------------------------------------------------------
  - id: llm_call
    category: resource
    label: LLM Call
    description: >-
      OpenAI-compatible chat completions endpoint. Configure the
      provider, model, and generation parameters.
    default_unit: null
    consumes: []
    produces: []

  - id: codebook
    category: resource
    label: Codebook
    description: >-
      Select a codebook from your saved codebooks to use for
      classification or label extraction.
    default_unit: null
    consumes: []
    produces: []
