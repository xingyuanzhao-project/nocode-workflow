# Preset template: Flat Summary + Classification.
#
# Pipeline shape:
#   CSV input -> Processor (row) -> Processor (row) -> CSV output
#                              \-> LLM Call               \-> LLM Call
#                              \-> Codebook
#
# Target user: users whose CSV has one row per entity (no grouping). Each
# row is summarised in one LLM call, then classified against every key
# in the codebook in a second call. Both steps run row-by-row with full
# concurrency.
#
# Users start from this template, then edit:
#   - input_1.config.selected_file    to the CSV they uploaded
#   - llm_1.config.model              to the model they want
#   - output_1.config.output_path     to the artifact name they prefer

flow:
  name: flat_summary_classification
  description: "Per-row summary then per-row codebook classification"

  nodes:
    - id: input_1
      type: csv_input
      config:
        selected_file: data/df_text_by_report.csv

    - id: proc_summary
      type: processor
      config:
        unit: row
        prompt:
          instructions:
            - "Summarise the row in a single paragraph."
        io_schema:
          output:
            summary: string

    - id: proc_classify
      type: processor
      config:
        unit: row
        keys: all
        prompt:
          instructions:
            - "Classify the summary against every codebook key."
        io_schema:
          output:
            label: string

    - id: llm_1
      type: llm_call
      config:
        resource_id: default
        provider: openrouter
        model: meta-llama/llama-3.1-70b-instruct
        api_base: https://openrouter.ai/api/v1
        api_key_env: OPENROUTER_API_KEY
        temperature: 0.0
        max_tokens: 1024

    - id: codebook_1
      type: codebook
      config:
        codebook_id: default-codebook

    - id: output_1
      type: csv_output
      config:
        output_path: results_custom/flat_summary_classification_summary.csv
        artifact_paths:
          - results_custom/flat_summary_classification_results.csv
        extend: false

  edges:
    - type: feedforward
      source: input_1
      target: proc_summary
    - type: feedforward
      source: proc_summary
      target: proc_classify
    - type: feedforward
      source: proc_classify
      target: output_1
    - type: llm_call
      source: proc_summary
      target: llm_1
    - type: llm_call
      source: proc_classify
      target: llm_1
    - type: codebook_inquiry
      source: proc_classify
      target: codebook_1

  settings:
    async:
      enabled: true
      max_concurrent_rows: 50
      max_concurrent_llm_calls: 50
      max_retries: 5
    logging:
      file: processing.log
      log_progress: true
    display:
      use_progress_bar: true
    prompts: config/prompts.json
