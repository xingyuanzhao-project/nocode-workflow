# Preset template: Full Pipeline (full-async label extraction + summary).
#
# Pipeline shape:
#   CSV Data -> Group By entity -> Label Extraction (document)
#              -> Label Summary (entity, full_async) -> CSV Output
#
# Target user: experienced users running on hosted LLMs with generous
# concurrency limits. Identical topology to label_extraction_summary but
# with ``label_summary.mode: full_async`` so every per-document extraction
# and every per-document summary runs concurrently inside each entity.
# Synthesis then reconciles the per-document summaries into one entity-
# level summary.
#
# This template is the most sophisticated valid pipeline expressible with
# the current unit-compatibility rules (document -> entity). Classification
# is a row-level step and cannot follow an entity-level summary; the user
# can run the separate ``flat_summary_classification`` template against
# the aggregated summary if they want classification on top.
#
# Users start from this template, then edit:
#   - data.input_csv        to the CSV they uploaded
#   - data.column_roles.*   to match their CSV column names
#   - resources[0].model    to the model they want
#   - async.max_*           to the concurrency their provider allows
#   - output.*              to artifact names they prefer

flow:
  schema_version: 1
  name: full_pipeline
  description: "Full async label extraction + per-entity summary synthesis"

  resources:
    - id: default
      type: llm_provider
      provider: openrouter
      model: meta-llama/llama-3.1-70b-instruct
      api_base: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      temperature: 0.0
      max_tokens_summary: 1024
      max_tokens_classification: 256

  data:
    input_csv: data/df_text_by_report.csv
    column_roles:
      text: text
      entity_id: victim
      doc_id: index
      sort_by: index

  taxonomy: config/taxonomy.json
  prompts: config/prompts.json

  steps:
    - type: label_extraction
      unit: document
      group_by: entity

    - type: label_summary
      unit: entity
      mode: full_async

  async:
    enabled: true
    max_concurrent_rows: 15
    max_concurrent_llm_calls: 50
    max_retries: 5

  output:
    summary_csv: results_custom/full_pipeline_summary.csv
    results_csv: results_custom/full_pipeline_results.csv
    states_csv: results_custom/full_pipeline_states.csv
    spans_csv: results_custom/full_pipeline_spans.csv
    extend: false

  logging:
    file: processing.log
    log_progress: true
  display:
    use_progress_bar: true
