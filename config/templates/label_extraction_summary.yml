# Preset template: Label Extraction + Summary (hybrid).
#
# Pipeline shape:
#   CSV Data -> Group By entity -> Label Extraction (document)
#              -> Label Summary (entity, hybrid) -> CSV Output
#
# Target user: users with multiple documents per entity who want per-label
# extractive spans aggregated into one entity-level summary. Sequential
# chaining of previous_summary keeps the summary grounded in the cumulative
# context as documents are processed in order.
#
# Users start from this template, then edit:
#   - data.input_csv        to the CSV they uploaded
#   - data.column_roles.*   to match their CSV column names
#   - resources[0].model    to the model they want
#   - output.*              to artifact names they prefer

flow:
  schema_version: 1
  name: label_extraction_summary
  description: "Label extraction + sequential per-entity summary (hybrid mode)"

  resources:
    - id: default
      type: llm_provider
      provider: openrouter
      model: meta-llama/llama-3.1-70b-instruct
      api_base: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      temperature: 0.0
      max_tokens_summary: 1024
      max_tokens_classification: 256

  data:
    input_csv: data/df_text_by_report.csv
    column_roles:
      text: text
      entity_id: victim
      doc_id: index
      sort_by: index

  taxonomy: config/taxonomy.json
  prompts: config/prompts.json

  steps:
    - type: label_extraction
      unit: document
      group_by: entity

    - type: label_summary
      unit: entity
      mode: hybrid

  async:
    enabled: true
    max_concurrent_rows: 15
    max_concurrent_llm_calls: 50
    max_retries: 5

  output:
    summary_csv: results_custom/label_extraction_summary_summary.csv
    results_csv: results_custom/label_extraction_summary_results.csv
    states_csv: results_custom/label_extraction_summary_states.csv
    spans_csv: results_custom/label_extraction_summary_spans.csv
    extend: false

  logging:
    file: processing.log
    log_progress: true
  display:
    use_progress_bar: true
