# Preset template: Label Extraction + Summary (hybrid).
#
# Pipeline shape:
#   CSV input -> Processor (document, group_by entity)
#             -> Processor (entity, hybrid)
#             -> CSV output
#   Each processor connects out to one shared LLM Call node, and the
#   first processor consults the Codebook node.
#
# Target user: users with multiple documents per entity who want per-label
# extractive spans aggregated into one entity-level summary. Sequential
# chaining of previous_summary keeps the summary grounded in the cumulative
# context as documents are processed in order.
#
# Users start from this template, then edit:
#   - input_1.config.selected_file    to the CSV they uploaded
#   - llm_1.config.model              to the model they want
#   - output_1.config.output_path     to the artifact name they prefer

flow:
  name: label_extraction_summary
  description: "Label extraction + sequential per-entity summary (hybrid mode)"

  nodes:
    - id: input_1
      type: csv_input
      config:
        selected_file: data/df_text_by_report.csv

    - id: proc_extract
      type: processor
      config:
        unit: document
        group_by: entity
        prompt:
          instructions:
            - "Extract codebook label spans from each document."
        io_schema:
          output:
            spans: string

    - id: proc_summary
      type: processor
      config:
        unit: entity
        mode: hybrid
        prompt:
          instructions:
            - "Synthesise the per-document spans into a single entity summary."
        io_schema:
          output:
            summary: string

    - id: llm_1
      type: llm_call
      config:
        resource_id: default
        provider: openrouter
        model: meta-llama/llama-3.1-70b-instruct
        api_base: https://openrouter.ai/api/v1
        api_key_env: OPENROUTER_API_KEY
        temperature: 0.0
        max_tokens: 1024

    - id: codebook_1
      type: codebook
      config:
        codebook_id: default-codebook

    - id: output_1
      type: csv_output
      config:
        output_path: results_custom/label_extraction_summary_summary.csv
        artifact_paths:
          - results_custom/label_extraction_summary_results.csv
          - results_custom/label_extraction_summary_states.csv
          - results_custom/label_extraction_summary_spans.csv
        extend: false

  edges:
    - type: feedforward
      source: input_1
      target: proc_extract
    - type: feedforward
      source: proc_extract
      target: proc_summary
    - type: feedforward
      source: proc_summary
      target: output_1
    - type: llm_call
      source: proc_extract
      target: llm_1
    - type: llm_call
      source: proc_summary
      target: llm_1
    - type: codebook_inquiry
      source: proc_extract
      target: codebook_1

  settings:
    async:
      enabled: true
      max_concurrent_rows: 15
      max_concurrent_llm_calls: 50
      max_retries: 5
    logging:
      file: processing.log
      log_progress: true
    display:
      use_progress_bar: true
    prompts: config/prompts.json
