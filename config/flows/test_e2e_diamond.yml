flow:
  name: test_e2e_diamond
  description: "E2E test: diamond topology (fan-out A->B,C then fan-in B,C->D)"

  nodes:
    - id: input_1
      type: csv_input
      config:
        selected_file: data/df_text_by_report.csv
        input_columns:
          - column: text

    - id: proc_a
      type: processor
      config:
        prompt:
          instructions:
            - "Summarize the input text in one sentence."
            - "Return the summary in the 'base_summary' field of the output JSON."
        io_schema:
          output:
            base_summary:
              type: string

    - id: proc_b
      type: processor
      config:
        prompt:
          instructions:
            - "Read the 'base_summary' input field."
            - "Extract exactly 3 keywords from it, comma-separated."
            - "Return them in the 'keywords' field of the output JSON."
        io_schema:
          output:
            keywords:
              type: string

    - id: proc_c
      type: processor
      config:
        prompt:
          instructions:
            - "Read the 'base_summary' input field."
            - "Determine the overall sentiment: positive, negative, or neutral."
            - "Return the single word in the 'sentiment' field of the output JSON."
        io_schema:
          output:
            sentiment:
              type: string

    - id: proc_d
      type: processor
      config:
        prompt:
          instructions:
            - "Read the 'keywords' and 'sentiment' input fields."
            - "Combine them into one analysis sentence like: 'Keywords [X] with [Y] sentiment'."
            - "Return it in the 'combined_analysis' field of the output JSON."
        io_schema:
          output:
            combined_analysis:
              type: string

    - id: llm_1
      type: llm_call
      config:
        resource_id: default
        provider: openrouter
        model: google/gemini-2.0-flash-001
        api_base: https://openrouter.ai/api/v1
        api_key_env: OPENROUTER_API_KEY
        temperature: 0

    - id: output_1
      type: csv_output
      config:
        output_path: results_custom/test_e2e_diamond/output.csv
        output_fields:
          - combined_analysis
        extend: false

  edges:
    - type: feedforward
      source: input_1
      target: proc_a
    - type: feedforward
      source: proc_a
      target: proc_b
    - type: feedforward
      source: proc_a
      target: proc_c
    - type: feedforward
      source: proc_b
      target: proc_d
    - type: feedforward
      source: proc_c
      target: proc_d
    - type: feedforward
      source: proc_d
      target: output_1
    - type: llm_call
      source: proc_a
      target: llm_1
    - type: llm_call
      source: proc_b
      target: llm_1
    - type: llm_call
      source: proc_c
      target: llm_1
    - type: llm_call
      source: proc_d
      target: llm_1

  settings:
    processing_limit: 1
    async:
      max_concurrent_rows: 1
      max_concurrent_llm_calls: 2
      max_retries: 2
    logging:
      file: results_custom/test_e2e_diamond/processing.log
    display:
      use_progress_bar: false
    prompts: config/prompts.json
