# Label-based hybrid conversation pipeline.
# Mirrors scripts/run_summary_conversation_by_label.py with async.enabled=false.
#
# For each entity, documents are processed sequentially:
#   1. All labels extracted concurrently per document.
#   2. One summary call with previous_summary chaining.
#
# Run with:
#   python scripts/run_custom_flow.py
# after setting `flow_config` to this YAML path.

flow:
  schema_version: 1
  name: label_conversation_hybrid
  description: "Label extraction + sequential summary with previous_summary chaining"

  resources:
    - id: default
      type: llm_provider
      provider: openrouter
      model: meta-llama/llama-3.1-70b-instruct
      api_base: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      temperature: 0.0
      max_tokens_summary: 1024
      max_tokens_classification: 256

  data:
    input_csv: data/df_text_by_report.csv
    column_roles:
      text: text
      entity_id: victim
      doc_id: index
      sort_by: index

  taxonomy: config/taxonomy.json
  prompts: config/prompts.json

  processors:
    - type: label_extraction
      unit: row

    - type: label_summary
      unit: row
      mode: hybrid

  async:
    enabled: true
    max_concurrent_rows: 15
    max_concurrent_llm_calls: 50
    max_retries: 5

  output:
    summary_csv: results_custom/label_hybrid_summary.csv
    results_csv: results_custom/label_hybrid_results.csv
    states_csv: results_custom/label_hybrid_states.csv
    spans_csv: results_custom/label_hybrid_spans.csv
    extend: false

  logging:
    file: processing.log
    log_progress: true
  display:
    use_progress_bar: true
