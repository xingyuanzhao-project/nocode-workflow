# Label-based full-async conversation pipeline.
# Mirrors scripts/run_summary_conversation_by_label.py with async.enabled=true.
#
# For each entity, ALL labels × ALL documents are extracted concurrently,
# ALL per-doc summaries run concurrently (no sequential chaining), then
# ONE synthesis call reconciles per-doc summaries into an entity-level summary.
#
# Run with:
#   python scripts/run_custom_flow.py
# after setting `flow_config` to this YAML path.

flow:
  schema_version: 1
  name: label_conversation_full_async
  description: "Label extraction + all-concurrent summaries + synthesis"

  resources:
    - id: default
      type: llm_provider
      provider: openrouter
      model: meta-llama/llama-3.1-70b-instruct
      api_base: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      temperature: 0.0
      max_tokens_summary: 1024
      max_tokens_classification: 256

  data:
    input_csv: data/df_text_by_report.csv
    column_roles:
      text: text
      entity_id: victim
      doc_id: index
      sort_by: index

  taxonomy: config/taxonomy.json
  prompts: config/prompts.json

  processors:
    - type: label_extraction
      unit: row

    - type: label_summary
      unit: row
      mode: full_async

  async:
    enabled: true
    max_concurrent_rows: 15
    max_concurrent_llm_calls: 50
    max_retries: 5

  output:
    summary_csv: results_custom/label_full_async_summary.csv
    results_csv: results_custom/label_full_async_results.csv
    states_csv: results_custom/label_full_async_states.csv
    spans_csv: results_custom/label_full_async_spans.csv
    extend: false

  logging:
    file: processing.log
    log_progress: true
  display:
    use_progress_bar: true
