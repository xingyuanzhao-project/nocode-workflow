# Live smoke-test flow for agent_paper port of messy_text.
#
# Uses the real OpenRouter OpenAI-compatible endpoint
# (https://openrouter.ai/api/v1) with the OpenRouter key stored in
# project-root .env as OPENROUTER_API_KEY.
#
# Model choice: google/gemini-2.5-pro. Slug verified against
# https://openrouter.ai/api/v1/models on 2026-04-19. Accepts the
# loose json_schema shape declared in src/processors.py
# (`relevant_context: {"type": "array"}` without `items`) where
# OpenAI gpt-4o-mini rejects it.
#
# max_tokens bumped well above the messy_text production defaults
# because Gemini 2.5 Pro spends reasoning tokens against the same
# budget as visible output. A first run at 1024 returned empty
# `summary` fields and mid-sentence truncation, so we raise to 8192.
#
# processing_limit: 2 reproduces the historical 7/7/2/74-row baseline
# stored under results_custom/openrouter_smoke_*.csv. Lower it to 1 for
# a minimal one-entity live run when only wiring sanity is needed.

flow:
  schema_version: 1
  name: openrouter_smoke_test
  description: "Live smoke test against OpenRouter with real OPENROUTER_API_KEY"

  resources:
    - id: default
      type: llm_provider
      provider: openrouter
      model: google/gemini-2.5-pro
      api_base: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      temperature: 0.0
      max_tokens_summary: 8192
      max_tokens_classification: 1024

  data:
    input_csv: data/df_text_by_report.csv
    column_roles:
      text: text
      entity_id: victim
      doc_id: index
      sort_by: index

  taxonomy: config/taxonomy.json
  prompts: config/prompts.json

  steps:
    - type: conversation_summary_first
      unit: document
      group_by: entity

    - type: conversation_summary_update
      unit: document
      group_by: entity

  processing_limit: 2

  async:
    enabled: true
    max_concurrent_rows: 2
    max_concurrent_llm_calls: 4
    max_retries: 3

  output:
    summary_csv: results_custom/openrouter_smoke_summary.csv
    results_csv: results_custom/openrouter_smoke_results.csv
    states_csv: results_custom/openrouter_smoke_states.csv
    spans_csv: results_custom/openrouter_smoke_spans.csv
    extend: false

  logging:
    file: processing.log
    log_progress: true
    log_prompts: false
    log_response: false
  display:
    use_progress_bar: true
