flow:
  name: test_v2_run_2
  description: "V2 test: CSV classification with input_columns and output_fields"

  nodes:
    - id: input_1
      type: csv_input
      config:
        selected_file: data/df_text_by_report.csv
        input_columns:
          - role: text
            column: text
          - role: entity_id
            column: victim

    - id: proc_1
      type: processor
      config:
        unit: row
        prompt:
          instructions:
            - "Classify the following text into one of these categories: violence, economic, political, social, other."
            - "Return only the category name in the {summary_label} field."
            - "Set {info_found_label} to TRUE if the text contains meaningful content, FALSE if it is an error page or empty."
        io_schema:
          output:
            info_found:
              type: string
            relevant_context:
              type: array
            summary:
              type: string

    - id: llm_1
      type: llm_call
      config:
        resource_id: default
        provider: openrouter
        model: google/gemini-2.0-flash-001
        api_base: https://openrouter.ai/api/v1
        api_key_env: OPENROUTER_API_KEY
        temperature: 0

    - id: output_1
      type: csv_output
      config:
        output_path: results_custom/test_v2_run_2/output.csv
        output_fields:
          - category
        extend: false

  edges:
    - type: feedforward
      source: input_1
      target: proc_1
    - type: feedforward
      source: proc_1
      target: output_1
    - type: llm_call
      source: proc_1
      target: llm_1

  settings:
    processing_limit: 2
    async:
      enabled: true
      max_concurrent_rows: 2
      max_concurrent_llm_calls: 2
      max_retries: 3
    logging:
      file: results_custom/test_v2_run_2/processing.log
      log_progress: true
    display:
      use_progress_bar: false
    prompts: config/prompts.json
