# Per-row summarisation (no entity grouping, no classification).
# Mirrors the topology of scripts/run_summary.py.
#
# Run with:
#   python scripts/run_custom_flow.py
# after setting `flow_config` to this YAML path.

flow:
  schema_version: 1
  name: summary_only
  description: "Per-row single-pass summarisation — no classification"

  resources:
    - id: default
      type: llm_provider
      provider: openrouter
      model: meta-llama/llama-3.1-70b-instruct
      api_base: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      temperature: 0.0

  data:
    input_csv: data/df_text_by_report.csv
    column_roles:
      text: text
      entity_id: victim
      doc_id: index
      sort_by: index

  taxonomy: config/taxonomy.json
  prompts: config/prompts.json

  processors:
    - type: single_summary
      unit: row

  async:
    enabled: true
    max_concurrent_rows: 50
    max_concurrent_llm_calls: 50
    max_retries: 5

  output:
    summary_csv: results_custom/summary_only.csv
    extend: false

  logging:
    file: processing.log
    log_progress: true
  display:
    use_progress_bar: true
