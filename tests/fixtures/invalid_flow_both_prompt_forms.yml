# A step declares both inline prompt and prompts_ref; must be rejected
# by StepConfig.validate_prompt_sources.
flow:
  schema_version: 1
  name: invalid_both_prompt_forms
  description: Inline prompt and prompts_ref are mutually exclusive.
  resources:
    - id: default
      type: llm_provider
      provider: openrouter
      model: meta-llama/llama-3.1-70b-instruct
      api_base: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
  data:
    input_csv: data/df_text_by_report.csv
  taxonomy: config/taxonomy.json
  prompts: config/prompts.json
  steps:
    - type: single_summary
      unit: row
      prompts_ref: summary
      prompt:
        instructions: ["inline override"]
        output_format:
          summary: "<text>"
  output:
    summary_csv: results/fixture/summary.csv
