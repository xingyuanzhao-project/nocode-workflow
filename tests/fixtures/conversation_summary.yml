# Valid flow fixture used by every test that needs a known-good flow.
# Matches the topology of config/flows/conversation_summary.yml but uses
# the isolated test data paths so it is safe to run anywhere.

flow:
  schema_version: 1
  name: fixture_conversation_summary
  description: Valid fixture for the pytest suite.

  resources:
    - id: default
      type: llm_provider
      provider: openrouter
      model: meta-llama/llama-3.1-70b-instruct
      api_base: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      temperature: 0.0
      max_tokens_summary: 1024
      max_tokens_classification: 256

  data:
    input_csv: data/df_text_by_report.csv
    column_roles:
      text: text
      entity_id: victim
      doc_id: index
      sort_by: index

  taxonomy: config/taxonomy.json
  prompts: config/prompts.json

  steps:
    - type: conversation_summary_first
      unit: document
      group_by: entity

    - type: conversation_summary_update
      unit: document
      group_by: entity

  async:
    enabled: true
    max_concurrent_rows: 2
    max_concurrent_llm_calls: 4
    max_retries: 3

  output:
    summary_csv: results/fixture/summary.csv
    results_csv: results/fixture/results.csv
    states_csv: results/fixture/states.csv
    spans_csv: results/fixture/spans.csv
    extend: false

  logging:
    file: results/fixture/processing.log
    log_progress: true
    log_prompts: false
    log_response: false
  display:
    use_progress_bar: false
