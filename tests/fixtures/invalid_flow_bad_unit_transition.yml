# Adjacent steps violate VALID_ADJACENT_UNIT_TRANSITIONS (row -> entity).
flow:
  schema_version: 1
  name: invalid_bad_unit_transition
  description: Row-to-entity transition is not allowed.
  resources:
    - id: default
      type: llm_provider
      provider: openrouter
      model: meta-llama/llama-3.1-70b-instruct
      api_base: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
  data:
    input_csv: data/df_text_by_report.csv
    column_roles:
      text: text
      entity_id: victim
      doc_id: index
      sort_by: index
  taxonomy: config/taxonomy.json
  prompts: config/prompts.json
  steps:
    - type: single_summary
      unit: row
    - type: label_summary
      unit: entity
      mode: hybrid
  output:
    summary_csv: results/fixture/summary.csv
